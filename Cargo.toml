[package]
name = "kettle"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = "1"
unicode-segmentation = "1"
nix = { version = "0.31", features = ["process", "signal"] }
reqwest = { package = "zed-reqwest", version = "0.12.15-zed", features = ["blocking", "json"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
security-framework-sys = "2.17"

[dev-dependencies]
criterion = "0.7"
proptest = "1"
tempfile = "3"

[[bench]]
name = "search"
harness = false

[lints]
workspace = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = ["tools/icon-gen", "tools/askpass"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
