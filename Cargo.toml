[package]
name = "kettle"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace]
members = ["tools/icon-gen", "tools/askpass"]
